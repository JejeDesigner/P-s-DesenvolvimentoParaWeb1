{% extends 'master.html' %}

{% block title %}
        - List of all Members
{% endblock %}

{% block content %}
    <div class="card mt-2">

        <div class="card-header">
            Members
        </div>

        <div class="card-body">
             <ul class="list-group">
                {% for x in my_members %}
                    <li><a href="details/{{ x.id }}">{{ x.first_name }} {{x.last_name }}</a></li>
                {% endfor %}
            </ul>

            <p class="mt-3">
                <a href="add/">Add member</a>
            </p>
        
        </div>
    </div>
{% endblock %}
